<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Where the mind is without fear"><title>Where the mind is without fear</title><defs><style>@font-face{font-family:'ISI';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IN';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');}
.fu{opacity:0;animation:fu 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fi{opacity:0;animation:fi 1.4s ease forwards}
@keyframes fi{to{opacity:1}}
</style><clipPath id="panel"><rect width="1280" height="300" rx="20"/></clipPath></defs><g clip-path="url(#panel)"><rect width="1280" height="300" fill="#0a0a0b"/><defs><linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#a9a9b0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a9a9b0"/><animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="1280 0" dur="7s" repeatCount="indefinite"/></linearGradient></defs><g class="fi"><rect x="502.9" y="86" width="48" height="1" fill="#6f6f77"/><rect x="729.1" y="86" width="48" height="1" fill="#6f6f77"/><text x="640.0" y="90.0" font-family="JB" font-size="11" fill="#8b8b93" text-anchor="middle" letter-spacing="5" >ABIR’S WORLD</text></g><text x="640.0" y="172.0" font-family="ISI" font-size="70" fill="url(#sh)" text-anchor="middle" class="fu" style="animation-delay:0.2s">Where the mind is without fear</text><text x="640.0" y="216.0" font-family="IN" font-size="14" fill="#8b8b93" text-anchor="middle" class="fu" style="animation-delay:0.5s">after Rabindranath Tagore — Gitanjali, 1910</text><text x="640.0" y="250.0" font-family="JB" font-size="10" fill="#6f6f77" text-anchor="middle" letter-spacing="3" class="fu" style="animation-delay:0.7s">A WORLD BUILT ON CURIOSITY, CODE AND POSSIBILITY</text></g><rect x="0.5" y="0.5" width="1279" height="299" rx="19.5" fill="none" stroke="#232328"/></svg>